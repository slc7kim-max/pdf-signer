<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 서명하기</title>
<meta name="description" content="PDF에 서명을 넣어 내려받아요. 파일은 이 기기 밖으로 나가지 않아요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f2f4f6;
  --text: #191f28;
  --text-sub: #6b7684;
  --text-sub-strong: #4e5968;
  --line: #e5e8eb;
  --blue: #3182f6;
  --red: #f04452;
  --green: #03b26c;
  --r-card: 16px;
  --r-big: 12px;
  --r-small: 8px;
  --motion: 150ms;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  word-break: keep-all;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.625rem; font-weight: 700; line-height: 1.5; }
h2 { font-size: 1.25rem; font-weight: 700; line-height: 1.5; }
.small { font-size: 0.8125rem; line-height: 1.5; color: var(--text-sub); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; height: 44px; padding: 0 16px;
  border: 0; border-radius: var(--r-small);
  background: var(--bg-soft); color: var(--text);
  font-size: 1rem; font-weight: 600; white-space: nowrap;
  transition: background-color var(--motion);
}
.btn:hover { background: var(--line); }
.btn-big { height: 52px; border-radius: var(--r-big); padding: 0 20px; }
.btn-primary { background: var(--blue); color: #fff; font-size: 1.125rem; font-weight: 700; }
.btn-primary:hover { background: #1b64da; }
.btn-primary:disabled { background: var(--line); color: var(--text-sub-strong); cursor: not-allowed; }
.btn-full { width: 100%; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 24px 0 16px; }
header.top .small { margin-top: 4px; }

/* 빈 화면 */
.empty {
  border: 2px dashed var(--line); border-radius: var(--r-card);
  padding: 48px 16px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  transition: border-color var(--motion), background-color var(--motion);
}
.empty.drag { border-color: var(--text-sub); background: var(--bg-soft); }
.empty svg { width: 56px; height: 56px; }
.empty .desc { color: var(--text-sub); }
.empty .btn { margin-top: 8px; }

/* 알림 */
.notice {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-radius: var(--r-small);
  background: var(--bg-soft); border-left: 4px solid var(--text-sub);
}
.notice:empty { display: none; }
.notice.error { border-left-color: var(--red); }
.notice.done { border-left-color: var(--green); }
.notice .ico { flex: none; width: 24px; height: 24px; margin-top: 0; }
.notice .body { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.notice .body p { color: var(--text); }
.notice .body .btn { align-self: flex-start; background: var(--bg); }
.notice .body .btn:hover { background: var(--line); }

/* 작업 화면: 휴대폰 먼저 */
.work { display: grid; gap: 12px; grid-template-areas: "bar" "viewer" "thumbs" "panel"; padding-bottom: 120px; }
.bar { grid-area: bar; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar .name { flex: 1 1 160px; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.viewer { grid-area: viewer; background: var(--bg-soft); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.viewer .page-label { margin-bottom: 8px; color: var(--text-sub-strong); font-size: 0.8125rem; }
.stage { position: relative; margin: 0 auto; background: #fff; border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: 100%; }
.layer { position: absolute; inset: 0; }

.thumbs { grid-area: thumbs; min-width: 0; }
.thumbs h2 { font-size: 1rem; margin-bottom: 8px; }
.thumb-list { list-style: none; margin: 0; padding: 4px; display: flex; gap: 12px; overflow-x: auto; }
.thumb {
  flex: none; width: 96px; padding: 4px; border: 2px solid transparent; border-radius: var(--r-small);
  background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
}
.thumb:hover { background: var(--bg-soft); }
.thumb canvas { display: block; width: 84px; border: 1px solid var(--line); background: #fff; }
.thumb .t-label { font-size: 0.8125rem; color: var(--text-sub-strong); }
.thumb .t-count { font-size: 0.8125rem; font-weight: 700; color: var(--text); min-height: 1.2em; }
.thumb[aria-current="true"] { border-color: var(--text); }
.thumb[aria-current="true"] .t-label { color: var(--text); font-weight: 700; }

.panel { grid-area: panel; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.make-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sig-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sig-item { display: flex; align-items: center; gap: 8px; }
.sig-pick {
  flex: 1; min-height: 64px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-small);
  background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.sig-pick:hover { background: var(--bg-soft); }
.sig-pick img { max-height: 48px; max-width: 60%; object-fit: contain; }
.sig-pick span { font-size: 0.8125rem; color: var(--text-sub-strong); }
.icon-btn { width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--r-small); background: var(--bg-soft); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 20px; height: 20px; }

.save-box {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px;
}
.save-box > * { max-width: 1008px; margin: 0 auto; width: 100%; }

/* 놓인 서명 */
.placed {
  position: absolute; touch-action: none; cursor: move;
  border: 2px solid transparent; border-radius: 4px;
}
.placed img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.placed:hover { border-color: var(--line); }
.placed.on { border-color: var(--text); }
.placed:focus-visible { outline-offset: 4px; }
.handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: none; touch-action: none; }
.handle::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border-radius: 50%; background: #fff; border: 2px solid var(--text);
}
.placed.on .handle { display: block; }
.h-nw { left: 0; top: 0; cursor: nwse-resize; }
.h-ne { left: 100%; top: 0; cursor: nesw-resize; }
.h-sw { left: 0; top: 100%; cursor: nesw-resize; }
.h-se { left: 100%; top: 100%; cursor: nwse-resize; }
.del {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 8px);
  display: none; height: 44px; padding: 0 12px; border: 0; border-radius: var(--r-small);
  background: var(--text); color: #fff; font-size: 0.875rem; font-weight: 600; white-space: nowrap;
  align-items: center; gap: 4px;
}
.placed.below .del { bottom: auto; top: calc(100% + 8px); }
.placed.on .del { display: inline-flex; }
.del svg { width: 16px; height: 16px; }

/* 서명 만들기 창 */
dialog {
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0;
  border-radius: var(--r-card); color: var(--text); background: var(--bg);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
.dlg { padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg-soft); border-radius: var(--r-small); }
.tab { height: 44px; border: 0; border-radius: 6px; background: none; font-weight: 600; color: var(--text-sub-strong); }
.tab[aria-selected="true"] { background: #fff; color: var(--text); border: 1px solid var(--line); }
.pad {
  position: relative; border: 2px dashed var(--text-sub); border-radius: var(--r-big);
  height: 220px; background: #fff; overflow: hidden;
}
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.pad .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-sub); pointer-events: none; padding: 16px; text-align: center; }
.pad .line { position: absolute; left: 24px; right: 24px; bottom: 56px; border-top: 1px solid var(--line); pointer-events: none; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
.drop.drag { background: var(--bg-soft); }
.drop img { max-width: 100%; max-height: 150px; object-fit: contain; }
.drop-preview { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
  background-image: linear-gradient(45deg, var(--bg-soft) 25%, transparent 25%, transparent 75%, var(--bg-soft) 75%), linear-gradient(45deg, var(--bg-soft) 25%, transparent 25%, transparent 75%, var(--bg-soft) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.drop-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.dlg-foot { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.pad-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* 넓은 화면 */
@media (min-width: 860px) {
  .work {
    grid-template-columns: 128px minmax(0, 1fr) 272px;
    grid-template-areas: "bar bar bar" "thumbs viewer panel";
    align-items: start; padding-bottom: 48px;
  }
  .thumbs { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .thumb-list { flex-direction: column; overflow-x: visible; align-items: center; }
  .panel { position: sticky; top: 16px; }
  .save-box { position: static; padding: 0; border: 0; background: none; }
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion: 0ms; }
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PDF 서명하기</h1>
    <p class="small">PDF에 서명을 넣어 내려받아요. 파일은 이 기기 밖으로 나가지 않아요.</p>
  </header>

  <main>
    <!-- 빈 화면 -->
    <section id="start" aria-labelledby="startTitle">
      <div class="empty" id="dropZone">
        <svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="#6b7684" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 6h20l10 10v34H14z"/><path d="M34 6v10h10"/><path d="M21 38c3-6 5-6 6-2s3 4 5 0 3-3 5 0"/>
        </svg>
        <h2 id="startTitle">서명할 PDF를 올려 주세요</h2>
        <p class="desc">파일을 고르거나 여기로 끌어다 놓으면 돼요</p>
        <button type="button" class="btn btn-big btn-primary" id="pickPdfBtn">PDF 고르기</button>
      </div>
      <div class="notice error" id="startMsg" role="alert" style="margin-top:12px"></div>
    </section>

    <!-- 작업 화면 -->
    <section id="work" class="work hidden" aria-label="서명 넣기">
      <div class="bar">
        <p class="name" id="fileName"></p>
        <button type="button" class="btn" id="changePdfBtn">다른 PDF 고르기</button>
      </div>

      <nav class="thumbs" aria-labelledby="thumbsTitle">
        <h2 id="thumbsTitle">쪽 목록</h2>
        <ol class="thumb-list" id="thumbList"></ol>
      </nav>

      <div class="viewer" id="viewer">
        <p class="page-label" id="pageLabel" aria-live="polite"></p>
        <div class="stage" id="stage">
          <canvas id="pageCanvas" aria-label="문서 쪽 화면" role="img"></canvas>
          <div class="layer" id="layer"></div>
        </div>
      </div>

      <aside class="panel" aria-labelledby="sigTitle">
        <div class="card">
          <h2 id="sigTitle">내 서명</h2>
          <div class="make-btns">
            <button type="button" class="btn" id="drawBtn">서명 그리기</button>
            <button type="button" class="btn" id="importBtn">그림 불러오기</button>
          </div>
          <p class="small" id="sigHint">서명을 만들면 지금 보는 쪽에 바로 놓여요.</p>
          <ul class="sig-list" id="sigList"></ul>
        </div>
        <div class="save-box">
          <div class="notice" id="saveMsg" aria-live="polite"></div>
          <button type="button" class="btn btn-big btn-primary btn-full" id="saveBtn">PDF 내려받기</button>
        </div>
      </aside>
    </section>
  </main>
</div>

<input type="file" id="pdfInput" accept="application/pdf,.pdf" class="sr-only" tabindex="-1" aria-hidden="true">
<input type="file" id="imgInput" accept="image/png,image/jpeg" class="sr-only" tabindex="-1" aria-hidden="true">

<dialog id="sigDialog" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h2 id="dlgTitle">서명 만들기</h2>
    <div class="tabs" role="tablist" aria-label="서명 만드는 방법">
      <button type="button" class="tab" role="tab" id="tabDraw" aria-controls="paneDraw" aria-selected="true">직접 그리기</button>
      <button type="button" class="tab" role="tab" id="tabImg" aria-controls="paneImg" aria-selected="false" tabindex="-1">그림 불러오기</button>
    </div>

    <div id="paneDraw" role="tabpanel" aria-labelledby="tabDraw">
      <div class="pad">
        <div class="line"></div>
        <div class="ph" id="drawPh">여기에 손가락이나 마우스로 서명해 주세요</div>
        <canvas id="drawCanvas" aria-label="서명 그리는 칸"></canvas>
      </div>
      <div class="pad-tools" style="margin-top:8px">
        <p class="small">끊어서 여러 번 그려도 돼요.</p>
        <button type="button" class="btn" id="clearBtn">다시 그리기</button>
      </div>
    </div>

    <div id="paneImg" role="tabpanel" aria-labelledby="tabImg" class="hidden">
      <div class="pad drop" id="imgDrop">
        <div id="imgEmpty" class="drop">
          <p>서명 그림을 고르거나 여기로 끌어다 놓아 주세요</p>
          <button type="button" class="btn" id="pickImgBtn">그림 고르기</button>
        </div>
        <div id="imgPreview" class="drop-preview hidden"><img id="imgPreviewImg" alt="불러온 서명 그림"></div>
      </div>
      <div class="pad-tools" style="margin-top:8px">
        <p class="small">PNG, JPG 그림을 쓸 수 있어요. 흰 바탕은 투명하게 바뀌어요.</p>
        <button type="button" class="btn hidden" id="reImgBtn">그림 바꾸기</button>
      </div>
      <div class="notice error" id="imgMsg" role="alert" style="margin-top:8px"></div>
    </div>

    <div class="dlg-foot">
      <button type="button" class="btn btn-big" id="closeDlgBtn">닫기</button>
      <button type="button" class="btn btn-big btn-primary" id="useSigBtn" disabled>이 서명 놓기</button>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var pdfjs = window.pdfjsLib || window['pdfjs-dist/build/pdf'];

  var ICON = {
    error: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#f04452"/><path d="M12 7v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="#fff"/></svg>',
    done: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#03b26c"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#6b7684"/><path d="M12 11v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.4" fill="#fff"/></svg>',
    trash: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
  };

  /* 알림 칸: lines 는 쉬운 말 문장 배열, action 은 {label, onClick} */
  function notify(box, kind, lines, action) {
    box.className = 'notice ' + (kind === 'info' ? '' : kind);
    box.innerHTML = '';
    if (!lines) return;
    var body = document.createElement('div');
    body.className = 'body';
    lines.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; body.appendChild(p); });
    if (action) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = action.label;
      b.addEventListener('click', action.onClick);
      body.appendChild(b);
    }
    box.insertAdjacentHTML('afterbegin', ICON[kind] || ICON.info);
    box.appendChild(body);
  }
  function clearNotice(box) { box.className = 'notice'; box.innerHTML = ''; }

  if (!pdfjs || !window.PDFLib) {
    notify($('startMsg'), 'error',
      ['화면을 준비하지 못했어요.', '인터넷 연결이 끊겨서 그럴 수 있어요.', '연결을 확인한 뒤 다시 불러와 주세요.'],
      { label: '다시 불러오기', onClick: function () { location.reload(); } });
    $('pickPdfBtn').disabled = true;
    return;
  }
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var state = {
    bytes: null,      // 원본 PDF (손대지 않은 사본)
    fileName: '',
    doc: null,
    pages: [],        // { page, vp(배율 1), rotate }
    current: 0,
    sigs: [],         // { id, png(Uint8Array), url, ratio(높이/너비) }
    placed: [],       // { id, page, sigId, x, y, w, h } — 쪽 크기 대비 비율(0~1)
    selected: null
  };
  var uid = 0;
  function nextId() { uid += 1; return 'n' + uid; }

  /* ---------- PDF 불러오기 ---------- */
  var pdfInput = $('pdfInput');
  $('pickPdfBtn').addEventListener('click', function () { pdfInput.click(); });
  $('changePdfBtn').addEventListener('click', function () { pdfInput.click(); });
  pdfInput.addEventListener('change', function () {
    if (pdfInput.files[0]) openPdf(pdfInput.files[0]);
    pdfInput.value = '';
  });

  var dz = $('dropZone');
  ['dragenter', 'dragover'].forEach(function (t) { document.addEventListener(t, function (e) { if (hasFiles(e)) { e.preventDefault(); if (!state.doc) dz.classList.add('drag'); } }); });
  ['dragleave', 'drop'].forEach(function (t) { document.addEventListener(t, function () { dz.classList.remove('drag'); }); });
  document.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    if ($('sigDialog').open) return;
    var f = e.dataTransfer.files[0];
    if (f) openPdf(f);
  });
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0; }

  function showPdfError(lines) {
    var box = state.doc ? $('saveMsg') : $('startMsg');
    notify(box, 'error', lines, { label: '다른 PDF 고르기', onClick: function () { pdfInput.click(); } });
    if (!state.doc) box.focus && box.scrollIntoView({ block: 'nearest' });
  }

  async function openPdf(file) {
    clearNotice($('startMsg')); clearNotice($('saveMsg'));
    var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (!isPdf) {
      showPdfError(['PDF 파일만 열 수 있어요.', '고른 파일이 PDF인지 확인하고 다시 골라 주세요.']);
      return;
    }
    var bytes;
    try { bytes = new Uint8Array(await file.arrayBuffer()); }
    catch (e) { showPdfError(['파일을 읽지 못했어요.', '파일을 다시 골라 주세요.']); return; }

    var doc;
    try {
      doc = await pdfjs.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
    } catch (e) {
      if (e && e.name === 'PasswordException') {
        showPdfError(['암호가 걸린 PDF라서 열 수 없어요.', '암호를 푼 파일로 다시 올려 주세요.']);
      } else {
        showPdfError(['PDF를 열지 못했어요.', '파일이 망가졌을 수 있어요.', '다른 PDF로 다시 해 보세요.']);
      }
      return;
    }

    if (state.doc) state.doc.destroy();
    state.bytes = bytes;
    state.fileName = file.name;
    state.doc = doc;
    state.pages = [];
    state.placed = [];
    state.selected = null;
    for (var i = 1; i <= doc.numPages; i++) {
      var page = await doc.getPage(i);
      state.pages.push({ page: page, vp: page.getViewport({ scale: 1 }), rotate: page.rotate });
    }
    $('fileName').textContent = file.name;
    $('start').classList.add('hidden');
    $('work').classList.remove('hidden');
    buildThumbs();
    goTo(0);
  }

  /* ---------- 쪽 목록 ---------- */
  function buildThumbs() {
    var list = $('thumbList');
    list.innerHTML = '';
    state.pages.forEach(function (p, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'thumb'; b.dataset.i = i;
      var c = document.createElement('canvas');
      c.setAttribute('aria-hidden', 'true');
      var label = document.createElement('span'); label.className = 't-label'; label.textContent = (i + 1) + '쪽';
      var cnt = document.createElement('span'); cnt.className = 't-count';
      b.append(c, label, cnt);
      b.addEventListener('click', function () { goTo(i); });
      li.appendChild(b);
      list.appendChild(li);
    });
    updateThumbInfo();
    // 작은 그림은 차례로 그려요
    (async function () {
      var doc = state.doc;
      for (var i = 0; i < state.pages.length; i++) {
        if (doc !== state.doc) return;
        var p = state.pages[i];
        var c = list.children[i].querySelector('canvas');
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var vp = p.page.getViewport({ scale: (84 / p.vp.width) * dpr });
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        try { await p.page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; } catch (e) { /* 넘어가요 */ }
      }
    })();
  }

  function updateThumbInfo() {
    var btns = $('thumbList').querySelectorAll('.thumb');
    btns.forEach(function (b, i) {
      var n = state.placed.filter(function (s) { return s.page === i; }).length;
      b.querySelector('.t-count').textContent = n ? '서명 ' + n + '개' : '';
      b.setAttribute('aria-label', (i + 1) + '쪽' + (n ? ', 서명 ' + n + '개' : '') + (i === state.current ? ', 보는 중' : ''));
      if (i === state.current) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
  }

  /* ---------- 가운데 쪽 ---------- */
  var renderTask = null;
  function goTo(i) {
    state.current = i;
    state.selected = null;
    $('pageLabel').textContent = (i + 1) + '쪽 / 전체 ' + state.pages.length + '쪽';
    updateThumbInfo();
    var active = $('thumbList').children[i];
    if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    renderPage();
    drawPlaced();
  }

  async function renderPage() {
    var p = state.pages[state.current];
    if (!p) return;
    var viewer = $('viewer');
    var avail = viewer.clientWidth - 32;
    var maxH = Math.max(window.innerHeight * 0.9, 360);
    var cssW = Math.min(avail, p.vp.width * 1.6, maxH * p.vp.width / p.vp.height);
    cssW = Math.max(120, Math.floor(cssW));
    var cssH = Math.round(cssW * p.vp.height / p.vp.width);
    var stage = $('stage');
    stage.style.width = cssW + 'px';
    stage.style.height = cssH + 'px';
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var vp = p.page.getViewport({ scale: (cssW / p.vp.width) * dpr });
    var canvas = $('pageCanvas');
    canvas.setAttribute('aria-label', (state.current + 1) + '쪽 문서 화면');
    if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
    var off = document.createElement('canvas');
    off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
    renderTask = p.page.render({ canvasContext: off.getContext('2d'), viewport: vp });
    try {
      await renderTask.promise;
      canvas.width = off.width; canvas.height = off.height;
      canvas.getContext('2d').drawImage(off, 0, 0);
    } catch (e) { /* 다시 그리느라 멈춘 경우 */ }
  }

  var resizeTimer;
  new ResizeObserver(function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (state.doc) renderPage(); }, 120);
  }).observe($('viewer'));

  /* ---------- 놓인 서명 ---------- */
  var layer = $('layer');

  function sigById(id) { return state.sigs.find(function (s) { return s.id === id; }); }

  function drawPlaced() {
    layer.innerHTML = '';
    state.placed.filter(function (s) { return s.page === state.current; }).forEach(function (pl) {
      layer.appendChild(makePlacedEl(pl));
    });
  }

  function makePlacedEl(pl) {
    var sig = sigById(pl.sigId) || pl.sig;
    var el = document.createElement('div');
    el.className = 'placed' + (state.selected === pl.id ? ' on' : '');
    el.dataset.id = pl.id;
    el.tabIndex = 0;
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', (pl.page + 1) + '쪽에 놓인 서명. 화살표 키로 옮기고, 더하기와 빼기 키로 크기를 바꿔요.');
    var img = document.createElement('img');
    img.src = sig.url; img.alt = ''; img.draggable = false;
    el.appendChild(img);
    ['nw', 'ne', 'sw', 'se'].forEach(function (k) {
      var h = document.createElement('div');
      h.className = 'handle h-' + k; h.dataset.corner = k; h.setAttribute('aria-hidden', 'true');
      el.appendChild(h);
    });
    var del = document.createElement('button');
    del.type = 'button'; del.className = 'del';
    del.innerHTML = ICON.trash + '<span>서명 지우기</span>';
    del.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    del.addEventListener('click', function (e) { e.stopPropagation(); removePlaced(pl.id); });
    el.appendChild(del);
    placeStyle(el, pl);
    el.addEventListener('pointerdown', function (e) { startDrag(e, pl, el); });
    el.addEventListener('keydown', function (e) { onPlacedKey(e, pl, el); });
    el.addEventListener('focus', function () { select(pl.id); });
    return el;
  }

  function placeStyle(el, pl) {
    el.style.left = (pl.x * 100) + '%';
    el.style.top = (pl.y * 100) + '%';
    el.style.width = (pl.w * 100) + '%';
    el.style.height = (pl.h * 100) + '%';
    var stageH = $('stage').clientHeight || 1;
    el.classList.toggle('below', pl.y * stageH < 60);
  }

  function select(id) {
    state.selected = id;
    layer.querySelectorAll('.placed').forEach(function (el) { el.classList.toggle('on', el.dataset.id === id); });
  }

  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('.placed')) select(null);
  });

  function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }

  function startDrag(e, pl, el) {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    e.preventDefault();
    select(pl.id);
    el.focus({ preventScroll: true });
    var rect = layer.getBoundingClientRect();
    var corner = e.target.dataset ? e.target.dataset.corner : null;
    var s = { px: e.clientX, py: e.clientY, x: pl.x, y: pl.y, w: pl.w, h: pl.h };
    var ratio = pl.h / pl.w; // 쪽 비율 기준 높이/너비
    var target = e.target;
    target.setPointerCapture(e.pointerId);

    function move(ev) {
      var dx = (ev.clientX - s.px) / rect.width;
      var dy = (ev.clientY - s.py) / rect.height;
      if (!corner) {
        pl.x = clamp(s.x + dx, 0, 1 - pl.w);
        pl.y = clamp(s.y + dy, 0, 1 - pl.h);
      } else {
        var sx = corner.indexOf('w') >= 0 ? -1 : 1;
        var sy = corner.indexOf('n') >= 0 ? -1 : 1;
        var wx = s.w + sx * dx;
        var wy = (s.h + sy * dy) / ratio;
        var w = Math.abs(wx - s.w) > Math.abs(wy - s.w) ? wx : wy;
        var right = s.x + s.w, bottom = s.y + s.h;
        var maxW = sx > 0 ? 1 - s.x : right;
        var maxWbyH = (sy > 0 ? 1 - s.y : bottom) / ratio;
        w = clamp(w, 0.04, Math.min(maxW, maxWbyH));
        var h = w * ratio;
        pl.w = w; pl.h = h;
        pl.x = sx > 0 ? s.x : right - w;
        pl.y = sy > 0 ? s.y : bottom - h;
      }
      placeStyle(el, pl);
    }
    function up() {
      target.removeEventListener('pointermove', move);
      target.removeEventListener('pointerup', up);
      target.removeEventListener('pointercancel', up);
    }
    target.addEventListener('pointermove', move);
    target.addEventListener('pointerup', up);
    target.addEventListener('pointercancel', up);
  }

  function onPlacedKey(e, pl, el) {
    var step = e.shiftKey ? 0.02 : 0.005;
    var k = e.key;
    if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removePlaced(pl.id); return; }
    if (k === 'Escape') { select(null); el.blur(); return; }
    var ratio = pl.h / pl.w;
    if (k === 'ArrowLeft') pl.x -= step;
    else if (k === 'ArrowRight') pl.x += step;
    else if (k === 'ArrowUp') pl.y -= step;
    else if (k === 'ArrowDown') pl.y += step;
    else if (k === '+' || k === '=') { pl.w = Math.min(pl.w * 1.05, 1, 1 / ratio); pl.h = pl.w * ratio; }
    else if (k === '-' || k === '_') { pl.w = Math.max(pl.w / 1.05, 0.04); pl.h = pl.w * ratio; }
    else return;
    e.preventDefault();
    pl.x = clamp(pl.x, 0, 1 - pl.w);
    pl.y = clamp(pl.y, 0, 1 - pl.h);
    placeStyle(el, pl);
  }

  function removePlaced(id) {
    state.placed = state.placed.filter(function (s) { return s.id !== id; });
    state.selected = null;
    drawPlaced();
    updateThumbInfo();
    notify($('saveMsg'), 'info', ['서명을 지웠어요.']);
  }

  function placeSig(sig) {
    var p = state.pages[state.current];
    var pageRatio = p.vp.width / p.vp.height;
    var w = 0.3;
    var h = w * sig.ratio * pageRatio;
    if (h > 0.3) { h = 0.3; w = h / (sig.ratio * pageRatio); }
    var n = state.placed.filter(function (s) { return s.page === state.current; }).length;
    var pl = {
      id: nextId(), page: state.current, sigId: sig.id, sig: sig,
      w: w, h: h,
      x: clamp(0.5 - w / 2 + n * 0.03, 0, 1 - w),
      y: clamp(0.5 - h / 2 + n * 0.03, 0, 1 - h)
    };
    state.placed.push(pl);
    state.selected = pl.id;
    drawPlaced();
    updateThumbInfo();
    notify($('saveMsg'), 'info', [(state.current + 1) + '쪽에 서명을 놓았어요.', '끌어서 자리를 맞춰 주세요.']);
    $('viewer').scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    var el = layer.querySelector('[data-id="' + pl.id + '"]');
    if (el) el.focus({ preventScroll: true });
  }

  /* ---------- 내 서명 목록 ---------- */
  function addSig(png, w, h) {
    var sig = { id: nextId(), png: png, url: URL.createObjectURL(new Blob([png], { type: 'image/png' })), ratio: h / w };
    state.sigs.push(sig);
    renderSigList();
    return sig;
  }

  function renderSigList() {
    var list = $('sigList');
    list.innerHTML = '';
    state.sigs.forEach(function (sig, i) {
      var li = document.createElement('li'); li.className = 'sig-item';
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'sig-pick';
      b.setAttribute('aria-label', '서명 ' + (i + 1) + '번을 지금 쪽에 놓기');
      var img = document.createElement('img'); img.src = sig.url; img.alt = '';
      var t = document.createElement('span'); t.textContent = '이 쪽에 놓기';
      b.append(img, t);
      b.addEventListener('click', function () { placeSig(sig); });
      var d = document.createElement('button');
      d.type = 'button'; d.className = 'icon-btn'; d.innerHTML = ICON.trash;
      d.setAttribute('aria-label', '서명 ' + (i + 1) + '번을 목록에서 지우기');
      d.addEventListener('click', function () {
        state.sigs = state.sigs.filter(function (s) { return s !== sig; });
        renderSigList();
      });
      li.append(b, d);
      list.appendChild(li);
    });
    $('sigHint').textContent = state.sigs.length
      ? '서명을 누르면 지금 보는 쪽에 놓여요.'
      : '서명을 만들면 지금 보는 쪽에 바로 놓여요.';
  }

  /* ---------- 서명 만들기 창 ---------- */
  var dlg = $('sigDialog');
  var mode = 'draw';
  var imported = null; // { png, w, h }

  $('drawBtn').addEventListener('click', function () { openDialog('draw'); });
  $('importBtn').addEventListener('click', function () { openDialog('img'); });
  $('closeDlgBtn').addEventListener('click', function () { dlg.close(); });

  function openDialog(m) {
    clearPad();
    imported = null;
    showImported(null);
    clearNotice($('imgMsg'));
    dlg.showModal();
    setTab(m);
  }

  function setTab(m) {
    mode = m;
    var draw = m === 'draw';
    $('tabDraw').setAttribute('aria-selected', String(draw));
    $('tabImg').setAttribute('aria-selected', String(!draw));
    $('tabDraw').tabIndex = draw ? 0 : -1;
    $('tabImg').tabIndex = draw ? -1 : 0;
    $('paneDraw').classList.toggle('hidden', !draw);
    $('paneImg').classList.toggle('hidden', draw);
    if (draw) sizePad();
    updateUseBtn();
  }
  $('tabDraw').addEventListener('click', function () { setTab('draw'); });
  $('tabImg').addEventListener('click', function () { setTab('img'); });
  document.querySelector('.tabs').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      setTab(mode === 'draw' ? 'img' : 'draw');
      (mode === 'draw' ? $('tabDraw') : $('tabImg')).focus();
    }
  });

  function updateUseBtn() {
    $('useSigBtn').disabled = mode === 'draw' ? !strokes.length : !imported;
  }

  // 직접 그리기
  var pad = $('drawCanvas');
  var pctx = pad.getContext('2d');
  var strokes = [];
  var cur = null;
  var PAD_SCALE = 3; // 저장할 때 선명하게

  function sizePad() {
    var r = pad.getBoundingClientRect();
    if (!r.width) return;
    pad.width = Math.round(r.width * PAD_SCALE);
    pad.height = Math.round(r.height * PAD_SCALE);
    redrawPad();
  }
  function redrawPad() {
    pctx.clearRect(0, 0, pad.width, pad.height);
    pctx.lineCap = 'round'; pctx.lineJoin = 'round';
    pctx.strokeStyle = '#191f28';
    pctx.lineWidth = 2.6 * PAD_SCALE;
    strokes.forEach(drawStroke);
  }
  function drawStroke(pts) {
    pctx.beginPath();
    if (pts.length === 1) {
      pctx.arc(pts[0].x, pts[0].y, pctx.lineWidth / 2, 0, Math.PI * 2);
      pctx.fillStyle = '#191f28'; pctx.fill();
      return;
    }
    pctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      pctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    var last = pts[pts.length - 1];
    pctx.lineTo(last.x, last.y);
    pctx.stroke();
  }
  function padPoint(e) {
    var r = pad.getBoundingClientRect();
    return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height };
  }
  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    pad.setPointerCapture(e.pointerId);
    cur = [padPoint(e)];
    strokes.push(cur);
    $('drawPh').classList.add('hidden');
    redrawPad();
    updateUseBtn();
  });
  pad.addEventListener('pointermove', function (e) {
    if (!cur) return;
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(function (ev) { cur.push(padPoint(ev)); });
    redrawPad();
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { pad.addEventListener(t, function () { cur = null; }); });
  function clearPad() {
    strokes = []; cur = null;
    $('drawPh').classList.remove('hidden');
    pctx.clearRect(0, 0, pad.width, pad.height);
    updateUseBtn();
  }
  $('clearBtn').addEventListener('click', clearPad);
  window.addEventListener('resize', function () { if (dlg.open && mode === 'draw') sizePad(); });

  // 그림 불러오기
  var imgInput = $('imgInput');
  $('pickImgBtn').addEventListener('click', function () { imgInput.click(); });
  $('reImgBtn').addEventListener('click', function () { imgInput.click(); });
  imgInput.addEventListener('change', function () {
    if (imgInput.files[0]) loadSigImage(imgInput.files[0]);
    imgInput.value = '';
  });
  var imgDrop = $('imgDrop');
  ['dragenter', 'dragover'].forEach(function (t) { imgDrop.addEventListener(t, function (e) { e.preventDefault(); imgDrop.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (t) { imgDrop.addEventListener(t, function () { imgDrop.classList.remove('drag'); }); });
  imgDrop.addEventListener('drop', function (e) {
    e.preventDefault(); e.stopPropagation();
    var f = e.dataTransfer.files[0];
    if (f) loadSigImage(f);
  });

  function showImported(url) {
    $('imgPreview').classList.toggle('hidden', !url);
    $('imgEmpty').classList.toggle('hidden', !!url);
    $('reImgBtn').classList.toggle('hidden', !url);
    if (url) $('imgPreviewImg').src = url;
  }

  async function loadSigImage(file) {
    clearNotice($('imgMsg'));
    if (!/^image\/(png|jpeg)$/.test(file.type) && !/\.(png|jpe?g)$/i.test(file.name)) {
      notify($('imgMsg'), 'error', ['이 파일은 쓸 수 없어요.', 'PNG나 JPG 그림을 골라 주세요.'], { label: '다른 그림 고르기', onClick: function () { imgInput.click(); } });
      return;
    }
    try {
      var img = await loadImage(URL.createObjectURL(file));
      var out = cleanImage(img);
      if (!out) {
        notify($('imgMsg'), 'error', ['그림에서 서명을 찾지 못했어요.', '흰 바탕만 있는 그림일 수 있어요.', '서명이 잘 보이는 그림을 골라 주세요.'], { label: '다른 그림 고르기', onClick: function () { imgInput.click(); } });
        return;
      }
      var png = await canvasToPng(out);
      imported = { png: png, w: out.width, h: out.height };
      showImported(URL.createObjectURL(new Blob([png], { type: 'image/png' })));
      updateUseBtn();
    } catch (e) {
      notify($('imgMsg'), 'error', ['그림을 열지 못했어요.', '파일이 망가졌을 수 있어요.', '다른 그림으로 다시 해 보세요.'], { label: '다른 그림 고르기', onClick: function () { imgInput.click(); } });
    }
  }

  function loadImage(url) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = rej;
      im.src = url;
    });
  }

  // 흰 바탕을 투명하게 하고 빈 가장자리를 잘라요
  function cleanImage(img) {
    var max = 1600;
    var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    var w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d');
    x.drawImage(img, 0, 0, w, h);
    var d = x.getImageData(0, 0, w, h);
    var a = d.data;
    for (var i = 0; i < a.length; i += 4) {
      var lum = Math.min(a[i], a[i + 1], a[i + 2]);
      if (lum > 235) a[i + 3] = 0;
      else if (lum > 200) a[i + 3] = Math.round(a[i + 3] * (235 - lum) / 35);
    }
    x.putImageData(d, 0, 0);
    return trimCanvas(c, 2);
  }

  function trimCanvas(c, padPx) {
    var x = c.getContext('2d');
    var d = x.getImageData(0, 0, c.width, c.height).data;
    var minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for (var y = 0; y < c.height; y++) {
      for (var xx = 0; xx < c.width; xx++) {
        if (d[(y * c.width + xx) * 4 + 3] > 8) {
          if (xx < minX) minX = xx; if (xx > maxX) maxX = xx;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null;
    minX = Math.max(0, minX - padPx); minY = Math.max(0, minY - padPx);
    maxX = Math.min(c.width - 1, maxX + padPx); maxY = Math.min(c.height - 1, maxY + padPx);
    var out = document.createElement('canvas');
    out.width = maxX - minX + 1; out.height = maxY - minY + 1;
    out.getContext('2d').drawImage(c, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }

  function canvasToPng(c) {
    return new Promise(function (res, rej) {
      c.toBlob(function (b) {
        if (!b) return rej(new Error('png'));
        b.arrayBuffer().then(function (ab) { res(new Uint8Array(ab)); }, rej);
      }, 'image/png');
    });
  }

  $('useSigBtn').addEventListener('click', async function () {
    var png, w, h;
    if (mode === 'draw') {
      if (!strokes.length) return;
      var out = trimCanvas(pad, 3 * PAD_SCALE);
      if (!out) return;
      png = await canvasToPng(out); w = out.width; h = out.height;
    } else {
      if (!imported) return;
      png = imported.png; w = imported.w; h = imported.h;
    }
    var sig = addSig(png, w, h);
    dlg.close();
    placeSig(sig);
  });

  /* ---------- 내려받기 ---------- */
  $('saveBtn').addEventListener('click', savePdf);

  async function savePdf() {
    var btn = $('saveBtn');
    if (!state.placed.length) {
      notify($('saveMsg'), 'info', ['아직 놓은 서명이 없어요.', '서명을 만들어 문서에 먼저 놓아 주세요.']);
      return;
    }
    btn.disabled = true;
    btn.textContent = '파일 만드는 중';
    try {
      var bytes = await buildSignedPdf();
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = state.fileName.replace(/\.pdf$/i, '') + '-서명.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      notify($('saveMsg'), 'done', ['서명을 넣은 PDF를 내려받았어요.', '내려받은 파일은 기기의 다운로드 폴더에 있어요.']);
    } catch (e) {
      var enc = e && /encrypt/i.test(String(e.message || e));
      notify($('saveMsg'), 'error', enc
        ? ['서명을 넣지 못했어요.', '수정을 막아 둔 PDF라서 그래요.', '잠금을 푼 파일로 다시 해 보세요.']
        : ['서명을 넣지 못했어요.', '파일 모양이 특이해서 그럴 수 있어요.', '잠시 뒤 다시 눌러 보세요.'],
        enc ? { label: '다른 PDF 고르기', onClick: function () { pdfInput.click(); } }
            : { label: '다시 내려받기', onClick: savePdf });
    } finally {
      btn.disabled = false;
      btn.textContent = 'PDF 내려받기';
    }
  }

  // 원래 PDF 에 서명 그림만 더해요. 화면 비율 → PDF 좌표로 바꿔요.
  async function buildSignedPdf() {
    var PDFLib = window.PDFLib;
    var doc = await PDFLib.PDFDocument.load(state.bytes.slice());
    var pages = doc.getPages();
    var cache = new Map();
    for (var i = 0; i < state.placed.length; i++) {
      var pl = state.placed[i];
      var sig = sigById(pl.sigId) || pl.sig;
      var img = cache.get(sig.id);
      if (!img) { img = await doc.embedPng(sig.png); cache.set(sig.id, img); }
      var info = state.pages[pl.page];
      var vp = info.vp; // 배율 1, 쪽 회전 포함
      var wv = pl.w * vp.width, hv = pl.h * vp.height;
      var xv = pl.x * vp.width, yv = pl.y * vp.height;
      var pt = vp.convertToPdfPoint(xv, yv + hv); // 화면에서 서명의 왼쪽 아래
      pages[pl.page].drawImage(img, {
        x: pt[0], y: pt[1], width: wv, height: hv,
        rotate: PDFLib.degrees(info.rotate || 0)
      });
    }
    return doc.save();
  }
})();
</script>
